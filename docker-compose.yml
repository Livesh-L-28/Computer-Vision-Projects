services:
  cv-intelligence-suite:
    build:
      context: .
      dockerfile: Dockerfile
    image: cv-intelligence-suite:latest
    container_name: cv-intelligence-suite
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./outputs:/app/outputs
      - ./models:/app/models
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
