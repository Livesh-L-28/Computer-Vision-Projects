[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-vision-intelligence-suite"
version = "2.0.0"
description = "Advanced Computer Vision Intelligence Suite: Air Combat, Airport Surface Surveillance, and License Plate Recognition"
authors = [{ name = "Livesh", email = "livesh@example.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ultralytics>=8.1.0",
    "opencv-python>=4.9.0",
    "easyocr>=1.7.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "Pillow>=10.2.0",
    "tqdm>=4.66.0",
    "colorama>=0.4.6",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "F401", "E402"]
